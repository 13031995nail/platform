push-front:
  stage: push
  extends: ".push-docker-image"
  variables:
    IMAGE_NAME: '$FRONT_IMAGE_NAME'
    IMAGE_TAG: '$IMAGE_TAG_GLOB'
    BUILD_DIR: '$BUILD_DIR_GLOB'
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - ember-app/**/*
        - .gitlab-ci.yml
        - .ci/frontend.gitlab-ci.yml
        - deploy/**/*
        - docker-compose.yml
  needs:
    - job: build-front
      artifacts: true