plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.meterrecognition'
version = '1.0.0'

android {
  namespace 'expo.modules.meterrecognition'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'org.tensorflow:tensorflow-lite:2.13.0'
}
